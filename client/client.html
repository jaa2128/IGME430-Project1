<!DOCTYPE html>
<html lang="en">

<head>
  <title>Our simple HTTP server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">

  <script>

    // function to handle responses sent back by the server
    const handleResponse = async (response, parseResponse) => {

      // grab the content section so it can be written to 
      const content = document.querySelector('#content');

      // based on response write the respective status
      switch (response.status) {
        case 200:
          content.innerHTML = `<b>Success</b>`;
          break;
        case 201:
          content.innerHTML = `<b>Created</b>`;
          break;
        case 204:
          content.innerHTML = `<b>Updated (No Content)</b>`;
          break;
        case 400:
          content.innerHTML = `<b>Bad Request</b>`;
          break;
        case 404:
          content.innerHTML = `<b>Not Found</b>`;
          break;
        default:
          content.innerHTML = `Error code not implemented by client.`;
          break;
      }

      // If we want to parse the response
      if (parseResponse) {
        const obj = await response.json();

        // If there is a message display it
        if (obj.message) {
          content.innerHTML += `<p>Message: ${obj.message}</p>`;
        }
        else {
          // stringify JSON to display
          content.innerHTML += `<p>${JSON.stringify(obj)}</p>`;
        }

        console.log(obj);

      }
    }

    // function to send a POST request specifically to the server
    const sendPost = async (form) => {
      // Grab the info from the form
      const url = form.getAttribute('action');
      const method = form.getAttribute('method');

      // based on the form get all it's text and number input values to use for url
      const inputs = form.querySelectorAll('input[type="text"], input[type="number"]');

      // build js Object to be sent as JSON
      let formDataObj = {};

      // only member that can be an array
      const arrayField = ['genres'];

      // for each input
      for (const input of inputs) {

        // grab the value
        const value = input.value.trim();

        // if there is no value 
        if (!value) continue;

        // if the input's name is the same as the allowed arrayFields
        if (arrayField.includes(input.name)) {
          // create the array field splitting by commas
          formDataObj[input.name] = value.split(',')
            .map(value => value.trim()) // trims values with spaces after split
            .filter(value => value.length > 0); // ensures no empty strings
        }
        else {
          formDataObj[input.name] = value;
        }
      }

      // turn information to JSON by stringifying
      const formData = JSON.stringify(formDataObj);

      // await fetch response sending JSON, receiving JSON, and adding
      // our form data into the body of the request
      const response = await fetch(url, {
        method: method,
        headers: {
          'Content-Type': 'application/json',
          'Content-Length': formData.length,
          'Accept': 'application/json'
        },
        body: formData
      });

      // Once we have the response, handle it client sid
      handleResponse(response, method === 'post');
    };

    // function to send a request to server
    const requestUpdate = async (form) => {

      //Grab the URL and method described by the form
      let url;
      let method;

      url = (form.querySelector('#urlField')) ? form.querySelector('#urlField').value : form.getAttribute('action');

      method = (form.querySelector('#methodSelect')) ? form.querySelector('#methodSelect').value : form.getAttribute('method');

      // based on the form get all it's text input values to use for url
      const inputs = form.querySelectorAll('input[type="text"]');

      // begin building a query string
      let queryParams = [];

      // as long as there are text inputs add to query
      if (inputs.length) {
        // loop over every input
        for (let input of inputs) {

          // if there's a value
          if (input.value.trim() !== '') {

            // add it to the query while cleaning input
            queryParams.push(`${input.name}=${input.value.toLowerCase().trim()}`);
          }
        }
      }

      // if there's anything in the query add it to the URL
      if (queryParams.length) {
        url += `?${queryParams.join('&')}`;
      }

      // Await the fetch response using the URL and correct request method
      // Accept headers only support JSON
      const response = await fetch(url, {
        method,
        headers: {
          'Accept': 'application/json'
        },
      });

      // Now that there is a response, send it into the handleResponse function
      // second param determines whether to parse the response or not
      handleResponse(response, method === 'get');
    }

    const init = () => {
      // grab the forms
      const bookTitlesForm = document.querySelector('#bookTitlesForm');
      const booksForm = document.querySelector('#booksForm');
      const bookForm = document.querySelector('#bookForm');
      const newBookForm = document.querySelector('#newBookForm');
      const rateBookForm = document.querySelector('#rateBookForm');

      // Function to handle request for user form
      // also cancels built in html form action
      const getRequest = (e) => {
        e.preventDefault();
        requestUpdate(e.currentTarget);
        return false;
      }

      // Function to handle request for name form
      const postRequest = (e) => {
        e.preventDefault();
        sendPost(e.currentTarget);
        return false;
      }



      // Call respective functions for each form
      userForm.addEventListener('submit', getRequest);
      bookTitlesForm.addEventListener('submit', getRequest);
      booksForm.addEventListener('submit', getRequest);
      bookForm.addEventListener('submit', getRequest);
      newBookForm.addEventListener('submit', postRequest);
      rateBookForm.addEventListener('submit', postRequest);

    };

    window.onload = init;
  </script>
</head>

<body>
  <section id="top">
    <h3>Books API Tests</h3>

    <h3>/getBookTitles</h3>
    <form id="bookTitlesForm" action="/getBookTitles" method="get">
      <label for="language">Language: </label>
      <input id="languageField" type="text" name="language" />
      <label for="genre">Genre: </label>
      <input id="genreField" type="text" name="genre" />
      <input type="submit" value="Send Request" />
    </form>

    <h3>/getBooks</h3>
    <form id="booksForm" action="/getBooks" method="get">
      <label for="country">Country: </label>
      <input id="countryField" type="text" name="country" />
      <label for="language">Language: </label>
      <input id="languageField2" type="text" name="language" />
      <label for="genre">Genre: </label>
      <input id="genreField2" type="text" name="genre" />
      <input type="submit" value="Send Request" />
    </form>

    <h3>/getBook</h3>
    <form id="bookForm" action="/getBook" method="get">
      <label for="title">Title: </label>
      <input id="titleField" type="text" name="title" />
      <input type="submit" value="Send Request" />
    </form>

    <h3>/addBook</h3>
    <form id="newBookForm" action="/addBook" method="post">
      <label for="author">Author: </label>
      <input id="authorField" type="text" name="author" />
      <label for="country">Country: </label>
      <input id="countryField2" type="text" name="country" />
      <label for="language">Language: </label>
      <input id="languageField3" type="text" name="language" />
      <label for="pages">Pages: </label>
      <input id="pagesField" type="number" name="pages" />
      <label for="title">Title: </label>
      <input id="titleField2" type="text" name="title" />
      <label for="year">Year: </label>
      <input id="yearField" type="number" name="year" />
      <label for="genres">Genres: </label>
      <input id="genresField" type="text" name="genres" />
      <input type="submit" value="Add Book" />
    </form>

    <h3>/rateBook</h3>
    <form id="rateBookForm" action="/rateBook" method="post">
      <label for="title">Title: </label>
      <input id="titleField3" type="text" name="title" />
      <label for="rating">Rating: </label>
      <input id="yearField" type="number" name="rating" min="0" max="10" />
      <input type="submit" value="Rate Book" />
    </form>
  </section>
  <section id="content">
  </section>
</body>

</html>
